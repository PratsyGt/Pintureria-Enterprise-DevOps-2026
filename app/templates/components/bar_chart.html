
<div class="bar-chart" role="list" aria-label="{{ label }}">

    {% for row in series %}

        <div class="bar-item" role="listitem">

            <div>

                <span>
                    {{ row.label }}
                </span>

                <strong>
                    Q {{ row.value|floatformat:2 }}
                </strong>

            </div>

            <span class="bar-track">

                <span
                    class="bar-fill"
                    style="--bar-width:{{ row.width|stringformat:'.2f' }}%"
                ></span>

            </span>

        </div>

    {% empty %}

        {% include 'components/empty.html' with title='Sin movimientos en este período' description='Los datos aparecerán cuando se registren operaciones.' %}

    {% endfor %}

</div>
