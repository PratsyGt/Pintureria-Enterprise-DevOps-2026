
<div
    id="notifications"
    class="notifications"
    aria-label="Notificaciones"
>

    {% for message in messages %}

        <div
            class="toast {{ message.tags }}"
            role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}"
        >

            {% include 'components/icon.html' with name='info' %}

            <span>
                {{ message }}
            </span>

            <button
                type="button"
                class="icon-btn"
                data-dismiss
                aria-label="Cerrar notificación"
            >

                {% include 'components/icon.html' with name='close' %}

            </button>

        </div>

    {% endfor %}

</div>

<div
    class="sr-only"
    id="announcer"
    role="status"
    aria-live="polite"
    aria-atomic="true"
></div>
