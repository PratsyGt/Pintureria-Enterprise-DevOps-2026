apiVersion: v1
kind: ServiceAccount
metadata: {name: pos-release, namespace: pintureria-redes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pos-release, namespace: pintureria-redes}
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, create, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pos-release, namespace: pintureria-redes}
subjects: [{kind: ServiceAccount, name: pos-release, namespace: pintureria-redes}]
roleRef: {kind: Role, name: pos-release, apiGroup: rbac.authorization.k8s.io}
