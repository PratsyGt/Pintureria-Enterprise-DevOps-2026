apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: pintureria-redes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [__HOST__]
      secretName: pos-tls
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 8000}}}
