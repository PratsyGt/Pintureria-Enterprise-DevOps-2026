# Plantilla de referencia. ops/kube_secrets.py genera estos dos recursos en memoria.
apiVersion: v1
kind: Secret
metadata: {name: pos-secret, namespace: pintureria-redes}
type: Opaque
stringData:
  SECRET_KEY: __DJANGO_SECRET__
  DB_PASSWORD: __APP_PASSWORD__
---
apiVersion: v1
kind: Secret
metadata: {name: sql-admin, namespace: pintureria-redes}
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: __SA_PASSWORD__
