apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: pintureria-redes}
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: pos-web}}
  template:
    metadata: {labels: {app: pos-web}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: pos-web}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: pos-config}}, {secretRef: {name: pos-secret}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          lifecycle:
            preStop: {exec: {command: [sleep, "5"]}}
          readinessProbe:
            httpGet: {path: /health/ready/, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 5
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /health/live/, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: pintureria-redes}
spec:
  selector: {app: pos-web}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: web, namespace: pintureria-redes}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: pos-web}}
